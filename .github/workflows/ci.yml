# The gates INSTALL.md documents, run on every push to main and every PR.
#
# `npm ci` runs the package's own `prepare` (npm run build), so the checkout
# always has the generated lib/ that test/manifest.mjs audits; the explicit
# build step keeps that a visible gate instead of a side effect of installing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run i18n:extract
      - run: npm run build
      - run: npm test
